
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | NIKE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="confirmation-page">

    <header class="navbar dashboard-navbar">
        <a href="dashboard.html" class="logo">
            <span>NIKE</span>
        </a>
        <a href="dashboard.html">CONTINUE SHOPPING</a>
    </header>

    <main class="confirmation-container">

        <div class="confirmation-background-text">NIKE</div>

        <section class="confirmation-card">

            <div class="confirmation-top">
                <span>NIKE | ORDER CONFIRMATION</span>
            </div>

            <div class="confirmation-check">
                <span>✓</span>
            </div>

            <p class="confirmation-label">ORDER SUCCESSFULLY PLACED</p>

            <h1>THANK YOU<br>FOR YOUR ORDER.</h1>

            <div class="confirmation-order">
                <div>
                    <span>ORDER NUMBER</span>
                    <h3 id="orderNumber">NIKE-000000</h3>
                </div>

                <div>
                    <span>ORDER TOTAL</span>
                    <h3 id="orderTotal">₱0</h3>
                </div>
            </div>

            <a href="dashboard.html" class="confirmation-button">
                CONTINUE SHOPPING <span>→</span>
            </a>

            <div class="confirmation-footer">
                JUST DO IT. <span>NIKE</span>
            </div>

        </section>

    </main>

    <script src="order-confirmation.js"></script>

</body>
</html>
